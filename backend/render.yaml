# Render Blueprint — Deploy Iko Share backend (Node + PostgreSQL)
# นำไฟล์นี้ไปใช้บน Render (Blueprint -> New Blueprint) หรือสร้าง Service ด้วยมือตามค่าเหล่านี้
services:
  - type: web
    name: iko-share-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    # รัน migration ก่อน deploy เพื่อสร้างตารางให้เรียบร้อย
    preDeployCommand: npm run migrate
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://iko-share-frontend.vercel.app
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: iko-share-db
          property: connectionString

databases:
  - name: iko-share-db
    plan: free
    region: singapore
