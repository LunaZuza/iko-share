# Render Blueprint — Deploy Iko Share backend (Node + PostgreSQL)
# นำไฟล์นี้ไปใช้บน Render (Blueprint -> New Blueprint) หรือสร้าง Service ด้วยมือตามค่าเหล่านี้
services:
  - type: web
    name: iko-share-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: iko-share-db
    plan: free
    region: singapore
